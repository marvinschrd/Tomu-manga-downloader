name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check commit messages
        uses: cocogitto/cocogitto-action@v4.1.0
        with:
          command: check

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: go build -o tomu .

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: go build -o tomu.exe .

      - name: Test
        run: go test ./... -v -count=1
